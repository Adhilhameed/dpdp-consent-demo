<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrust Enterprise Portal — DPDP & Cookie Consent Sandbox</title>

  <style>
    :root {
      --primary: #0f62fe;
      --primary-hover: #0353e9;
      --dark: #161616;
      --surface: #ffffff;
      --bg: #f4f7fb;
      --border: #dfe3e8;
      --text: #1f2937;
      --muted: #6b7280;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding-bottom: 100px;
    }

    /* Top Navigation Bar */
    nav {
      background: var(--dark);
      color: #fff;
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand { font-weight: 700; font-size: 18px; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
    .badge { background: rgba(15, 98, 254, 0.25); color: #78a9ff; border: 1px solid #4589ff; font-size: 11px; padding: 2px 8px; border-radius: 99px; }
    .nav-actions button {
      background: #262626; color: #fff; border: 1px solid #393939; padding: 7px 14px;
      border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .nav-actions button:hover { background: #333; }

    /* Main Layout */
    .container { max-width: 1060px; margin: 32px auto; padding: 0 20px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px; }
    @media (max-width: 820px) { .container { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      margin-bottom: 20px;
    }
    .card h2 { font-size: 17px; margin-bottom: 6px; color: #111827; }
    .card p.sub { font-size: 13.5px; color: var(--muted); margin-bottom: 18px; }

    /* Form Controls */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .field input[type="text"], .field input[type="email"], select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    }
    .checkbox-row {
      display: flex; align-items: flex-start; gap: 10px; font-size: 13px;
      background: #f9fafb; padding: 10px 12px; border-radius: 8px; border: 1px solid #edf0f3; margin-bottom: 10px;
    }
    .checkbox-row input { margin-top: 3px; accent-color: var(--primary); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent; transition: 0.15s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: #fff; color: var(--text); border-color: #cbd5e1; }
    .btn-outline:hover { background: #f8fafc; }
    .btn-ghost { background: transparent; color: var(--primary); text-decoration: underline; padding: 8px 10px; }

    /* Live Cookie & Tracker Monitor */
    .tracker-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;
    }
    .tracker-meta strong { display: block; font-size: 13.5px; }
    .tracker-meta span { font-size: 12px; color: var(--muted); font-family: monospace; }
    .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; text-transform: uppercase; }
    .pill-active { background: #dcfce7; color: #15803d; }
    .pill-blocked { background: #fee2e2; color: #b91c1c; }

    /* Receipt / Audit Artifact Box */
    pre.receipt {
      background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 8px;
      font-size: 12px; overflow-x: auto; max-height: 230px;
    }

    /* ============================================================ */
    /* ONETRUST / OSANO / KETCH STYLE BANNER & PREFERENCE MODAL     */
    /* ============================================================ */

    /* Floating Shield Launcher (Bottom-Left like Osano / OneTrust) */
    #cmp-launcher {
      position: fixed; bottom: 20px; left: 20px; z-index: 900;
      background: var(--dark); color: #fff; border: none; border-radius: 99px;
      padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22); display: flex; align-items: center; gap: 8px;
    }
    #cmp-launcher:hover { background: #000; }

    /* Bottom Floating Card Banner (Ketch / OneTrust Style) */
    #cmp-banner {
      position: fixed; bottom: 20px; right: 20px; left: 20px; max-width: 980px; margin: 0 auto;
      background: #ffffff; border: 1px solid #d1d5db; border-radius: 14px;
      padding: 22px 26px; box-shadow: var(--shadow); z-index: 1000;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px;
    }
    #cmp-banner.hidden { display: none; }
    .banner-text { flex: 1 1 520px; }
    .banner-text h3 { font-size: 16px; margin-bottom: 6px; color: #111827; }
    .banner-text p { font-size: 13px; color: #4b5563; }
    .banner-buttons { display: flex; flex-wrap: wrap; gap: 10px; }

    /* Preference Center Modal Overlay */
    #cmp-backdrop {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(2px); z-index: 1100; display: none;
      align-items: center; justify-content: center; padding: 16px;
    }
    #cmp-backdrop.open { display: flex; }

    .cmp-modal {
      background: #fff; width: 100%; max-width: 680px; border-radius: 14px;
      box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh;
    }
    .cmp-header {
      padding: 18px 24px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cmp-header h3 { font-size: 17px; }
    .cmp-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }

    .cmp-body { padding: 20px 24px; overflow-y: auto; }
    .cmp-intro { font-size: 13px; color: #4b5563; margin-bottom: 18px; }

    /* Accordion Category Rows */
    .cat-box { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .cat-head {
      padding: 14px 16px; background: #f8fafc; display: flex;
      justify-content: space-between; align-items: center;
    }
    .cat-title { font-weight: 600; font-size: 14px; }
    .cat-desc { padding: 12px 16px; font-size: 12.5px; color: #4b5563; border-top: 1px solid #edf0f3; background: #fff; }
    .always-on { font-size: 12px; font-weight: 700; color: var(--primary); }

    /* Modern Toggle Switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0; background-color: #cbd5e1;
      transition: .2s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    .cmp-footer {
      padding: 16px 24px; border-top: 1px solid var(--border); background: #f9fafb;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }
  </style>
</head>

  <div class="container">

    <div>

          <div class="checkbox-row">
